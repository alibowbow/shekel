const BN=new Set(C.flatMap(x=>x.bn)),S={tab:'binance',q:'',sort:'change',fav:new Set(JSON.parse(localStorage.getItem('shekel-fav')||'[]')),bn:new Map,mx:new Map,fund:new Map,bl:false,ml:false,last:null,socket:null};
const $=id=>document.getElementById(id),E={tabs:$('tabs'),search:$('search'),sort:$('sort'),rows:$('rows'),empty:$('empty'),count:$('count'),status:$('status'),statusText:$('statusText'),shade:$('shade'),close:$('close'),dSymbol:$('dSymbol'),dName:$('dName'),dPrice:$('dPrice'),dChange:$('dChange'),dFunding:$('dFunding'),chart:$('chart'),chartSource:$('chartSource'),chartMarket:$('chartMarket')};
const get=(map,a)=>{for(const k of a||[])if(map.has(k))return map.get(k);return null},bn=c=>{const m=get(S.bn,c.bn);return m&&{...m,funding:S.fund.get(m.symbol)??null}},mx=c=>get(S.mx,c.mx),market=c=>S.tab==='mexc'?(mx(c)||bn(c)):(bn(c)||mx(c));

function badges(c){return`${bn(c)?'<i class="badge bn">BINANCE</i>':''}${mx(c)?'<i class="badge mx">MEXC</i>':''}${c.chart?'<i class="badge dx">DEX</i>':''}`}

function render(){const a=list();E.count.textContent=`${a.length} 종목`;E.empty.classList.toggle('on',!a.length);E.rows.innerHTML=a.map(c=>{let m=market(c),ch=m?.change;return`<tr class="row" tabindex="0" data-id="${c.id}"><td class="favcell"><button class="fav ${S.fav.has(c.id)?'on':''}" data-fav="${c.id}" aria-label="즐겨찾기">★</button></td><td class="coin"><b>${esc(c.symbol)}</b><small>${esc(c.chain)}</small></td><td class="price ${m?'':'dim'}">${price(m?.price)}</td><td class="${cc(ch)}">${pct(ch)}</td><td class="vol ${m?'':'dim'}">${volume(m?.volume)}</td><td class="fund ${m?.funding==null?'dim':''}">${fund(m?.funding)}</td><td class="market"><span class="badges">${badges(c)}</span></td></tr>`}).join('');status()}

function tv(c,m){let sym=(m?.symbol||c.bn[0]||c.mx[0]||c.symbol+'USDT').replace('_',''),ex=m?.venue==='MEXC'&&!c.bn.length?'MEXC':'BINANCE';return'https://s.tradingview.com/widgetembed/?'+new URLSearchParams({symbol:`${ex}:${sym}.P`,interval:'15',theme:'dark',style:'1',locale:'kr',allow_symbol_change:'0',hideideas:'1'})}
function open(c){let m=market(c),ch=m?.change;E.dSymbol.innerHTML=esc(c.symbol)+' <span class="badges">'+badges(c)+'</span>';E.dName.textContent=`${c.name} · ${c.chain}`;E.dPrice.textContent=price(m?.price);E.dChange.textContent=pct(ch);E.dChange.className=cc(ch);E.dFunding.textContent=fund(m?.funding);E.chart.src=c.chart||tv(c,m);E.chartSource.textContent=c.chart?'GeckoTerminal':'TradingView';E.chartMarket.textContent=m?.venue||'DEX';E.shade.classList.add('on');E.shade.setAttribute('aria-hidden','false');document.body.classList.add('lock')}
function close(){E.shade.classList.remove('on');E.shade.setAttribute('aria-hidden','true');E.chart.src='about:blank';document.body.classList.remove('lock')}
E.tabs.onclick=e=>{let b=e.target.closest('[data-tab]');if(!b)return;S.tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));render()};E.search.oninput=e=>{S.q=e.target.value.trim().toLowerCase();render()};E.sort.onchange=e=>{S.sort=e.target.value;render()};E.rows.onclick=e=>{let f=e.target.closest('[data-fav]');if(f){e.stopPropagation();S.fav.has(f.dataset.fav)?S.fav.delete(f.dataset.fav):S.fav.add(f.dataset.fav);localStorage.setItem('shekel-fav',JSON.stringify([...S.fav]));return render()}let r=e.target.closest('[data-id]');if(r)open(C.find(c=>c.id===r.dataset.id))};E.rows.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('button')){e.preventDefault();let r=e.target.closest('[data-id]');if(r)open(C.find(c=>c.id===r.dataset.id))}};E.close.onclick=close;E.shade.onclick=e=>{if(e.target===E.shade)close()};onkeydown=e=>{if(e.key==='Escape')close()};
