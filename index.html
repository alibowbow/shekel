<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0e">
<title>SHEKEL</title>
<script>
(()=>{try{const saved=localStorage.getItem('shekel-theme');const theme=saved||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');document.documentElement.dataset.theme=theme}catch(_){}})();
</script>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark"></span>SHEKEL</div>
  <div class="head-actions">
    <div class="status" id="status"><span class="dot"></span><span id="statusText">연결 중</span></div>
    <button class="theme" id="theme" type="button" aria-label="라이트 모드로 전환" title="라이트 모드"><span id="themeIcon">☀</span></button>
  </div>
</header>
<main>
  <div class="controls">
    <nav class="tabs" id="tabs" aria-label="마켓">
      <button class="tab on" data-tab="binance">BINANCE <em id="bnCount">0</em></button>
      <button class="tab" data-tab="mexc">MEXC <em id="mxCount">0</em></button>
      <button class="tab" data-tab="dex">DEX <em id="dxCount">7</em></button>
      <button class="tab" data-tab="favorites">★ <em id="favCount">0</em></button>
    </nav>
    <div class="tools">
      <input class="search" id="search" type="search" inputmode="search" autocomplete="off" placeholder="심볼 검색" aria-label="심볼 검색">
      <select class="sort" id="sort" aria-label="정렬">
        <option value="change">24H 순</option><option value="volume">거래대금 순</option><option value="funding">펀딩 절댓값 순</option><option value="symbol">이름 순</option>
      </select>
    </div>
  </div>
  <section class="board">
    <table>
      <colgroup><col class="starcol" style="width:45px"><col class="coincol" style="width:27%"><col class="pricecol" style="width:18%"><col class="changecol" style="width:13%"><col style="width:17%"><col style="width:12%"><col style="width:13%"></colgroup>
      <thead><tr><th></th><th>종목</th><th>가격</th><th>24H</th><th class="vol">거래대금</th><th class="fund">펀딩</th><th class="market">마켓</th></tr></thead>
      <tbody id="rows"><tr class="loadingrow"><td colspan="7">시장 데이터 연결 중…</td></tr></tbody>
    </table>
    <div class="empty" id="empty">표시할 종목이 없습니다.</div>
  </section>
  <div class="foot"><span id="count">0 종목</span><span>공개 API · 읽기 전용</span></div>
</main>
<div class="shade" id="shade" aria-hidden="true">
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="종목 차트">
    <header class="dhead"><div class="dtitle"><b id="dSymbol"></b><small id="dName"></small></div><button class="close" id="close" aria-label="닫기">×</button></header>
    <div class="metrics"><div class="metric"><small>현재가</small><b id="dPrice">—</b></div><div class="metric"><small>24H</small><b id="dChange">—</b></div><div class="metric"><small>펀딩</small><b id="dFunding">—</b></div></div>
    <div class="chartbox"><div class="chartmeta"><span id="chartSource">임베드 차트</span><a id="chartOpen" href="#" target="_blank" rel="noopener noreferrer">새 창 ↗</a></div><div class="charthost" id="chartHost"><div class="chartload">차트 불러오는 중…</div></div></div>
  </aside>
</div>
<script src="app.js?v=3"></script>
</body>
</html>
